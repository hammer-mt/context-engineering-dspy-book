<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Analytics</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FAFAFA;
    color: #111827;
    font-family: Inter, system-ui, sans-serif;
    line-height: 1.5;
  }
  .hero {
    max-width: 640px;
    margin: 0 auto;
    padding: 72px 24px;
  }
  .brand {
    margin: 0 0 40px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #4338CA;
  }
  h1 {
    margin: 0 0 16px;
    font-size: 40px;
    line-height: 1.15;
    font-weight: 700;
  }
  .subhead {
    margin: 0 0 32px;
    font-size: 18px;
  }
  form {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  label {
    flex-basis: 100%;
    font-size: 14px;
    font-weight: 600;
  }
  input[type="email"] {
    flex: 1 1 240px;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid #111827;
    border-radius: 6px;
    background: #FAFAFA;
    color: #111827;
    font: inherit;
  }
  button {
    padding: 12px 24px;
    border: 0;
    border-radius: 6px;
    background: #4338CA;
    color: #FAFAFA;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .hero-image {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    margin-top: 48px;
    border: 1px solid #4338CA;
    border-radius: 6px;
    background: rgba(67, 56, 202, 0.06);
    object-fit: cover;
    font-size: 14px;
  }
  @media (max-width: 480px) {
    .hero { padding: 48px 20px; }
    h1 { font-size: 30px; }
    button { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<main>
  <section class="hero">
    <p class="brand">Acme Analytics</p>
    <h1>Operational analytics for teams that run on service levels</h1>
    <p class="subhead">Acme Analytics consolidates queue, throughput, and incident data into one reporting layer, so operations teams can measure cycle time and service-level compliance from a single source.</p>
    <form action="#" method="post">
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" placeholder="name@company.com" autocomplete="email" required>
      <button type="submit">Request access</button>
    </form>
    <img class="hero-image" src="/placeholders/hero.png" alt="Operations dashboard with throughput and service-level charts" data-image-brief="Clean product screenshot of an operations analytics dashboard: a throughput line chart and a service-level compliance table on a light background, indigo accents, no people, no decorative gradients.">
  </section>
</main>
</body>
</html>
